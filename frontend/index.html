<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swagat Group of Institutions</title>
  <meta name="description" content="Swagat Odisha the best Institute for education, Education, Innovation, Revolution">
  <link rel="icon" type="image/x-icon" href="/Swagat_Favicon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="modulepreload" href="/src/main.jsx" crossorigin>
  <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Dashboard fonts (Baloo 2 + Lato), loaded without blocking first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Lato:wght@400;700;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Lato:wght@400;700;900&display=swap"></noscript>
  <script>
    (function() {
      try {
        // Dark mode only exists in the dashboards; the public site is always light
        var isDashboard = window.location.pathname.indexOf('/dashboard') === 0;
        var saved = localStorage.getItem('darkMode');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDashboard && (saved === 'true' || (saved === null && prefersDark))) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
