  <script>
    (function() {
      try {
        // Opening loader: homepage only, first page of the visit (sessionStorage), never on reloads or other pages
        if (window.location.pathname === '/' && !sessionStorage.getItem('sw-intro-seen')) {
          sessionStorage.setItem('sw-intro-seen', '1');
          document.documentElement.classList.add('sw-boot');
        }
      } catch (e) {}
      try {
        // Dark mode only exists in the dashboards; the public site is always light
        var isDashboard = window.location.pathname.indexOf('/dashboard') === 0;
        var saved = localStorage.getItem('darkMode');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDashboard && (saved === 'true' || (saved === null && prefersDark))) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  </div>
  <script>
    (function() {
      var loader = document.getElementById('sw-loader');
      var root = document.documentElement;
      if (!loader) return;
      if (!root.classList.contains('sw-boot')) { loader.remove(); return; }
      // Stays only as long as the page is actually loading: until the homepage has rendered and the
      // page's files have loaded, after at least one page-turn cycle, and never longer than 8 seconds
      var MIN_MS = 1500, MAX_MS = 8000;
      var appReady = false, pageLoaded = document.readyState === 'complete', hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        loader.className = 'sw-loader-done';
        setTimeout(function() { root.classList.remove('sw-boot'); loader.remove(); }, 450);
      }
      function check() {
        if (!appReady || !pageLoaded) return;
        setTimeout(hide, Math.max(0, MIN_MS - performance.now()));
      }
      window.addEventListener('sw:app-ready', function() { appReady = true; check(); });
      window.addEventListener('load', function() { pageLoaded = true; check(); });
      setTimeout(hide, MAX_MS);
    })();
  </script>
